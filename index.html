<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>روبو - الذكاء التفاعلي للأطفال</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<style>
￼ { box-sizing: border-box; }
html, body {
margin: 0; padding: 0; height: 100%; width: 100%;
background: #000; overflow: hidden;
-webkit-user-select: none; user-select: none;
-webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
touch-action: manipulation;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
}
#face { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; z-index: 1; }
#hint {
position: fixed; left: 0; right: 0; bottom: calc(28px + env(safe-area-inset-bottom, 0px));
text-align: center; color: #ffffff; font-size: 22px; font-weight: bold; pointer-events: none;
transition: opacity .4s, transform .4s; z-index: 2;
text-shadow: 0 2px 10px rgba(0,0,0,0.7);
}
#status {
position: fixed; left: 0; right: 0; top: calc(10px + env(safe-area-inset-top, 0px));
text-align: center; color: #8fdcff; font-size: 13px; pointer-events: none; direction: ltr; z-index: 2;
font-family: monospace; text-shadow: 0 1px 4px rgba(0,0,0,0.8);
}
#hot { position: fixed; top: 0; left: 0; width: 80px; height: 80px; z-index: 3; }
#panel {
position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(5, 12, 20, 0.95); display: flex;
align-items: flex-start; justify-content: center; overflow-y: auto; z-index: 10;
padding: calc(20px + env(safe-area-inset-top, 0px)) 16px 24px;
box-sizing: border-box; -webkit-user-select: text; user-select: text; backdrop-filter: blur(10px);
}
#panel[hidden] { display: none; }
#panel .card { width: 100%; max-width: 520px; color: #d7eef8; }
#panel h2 { margin: 4px 0 14px; font-size: 22px; font-weight: 700; color: #8fdcff; }
#panel label { display: block; margin: 14px 0 6px; font-size: 14px; color: #8fdcff; font-weight: 600; }
#panel input[type=password], #panel input[type=text], #panel textarea {
width: 100%; box-sizing: border-box; background: #0b1a22; color: #eaf8ff;
border: 1px solid #2b4a58; border-radius: 12px; padding: 12px 14px; font-size: 15px;
font-family: inherit; transition: border-color .2s;
}
#panel input[type=password]:focus, #panel input[type=text]:focus, #panel textarea:focus {
border-color: #8fdcff; outline: none;
}
#panel textarea { min-height: 160px; line-height: 1.6; }
#panel .check { display: flex; align-items: center; gap: 8px; color: #d7eef8; margin-top: 15px; cursor: pointer; }
#panel .row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
#panel button {
background: #8fdcff; color: #001018; border: 0; border-radius: 10px;
padding: 12px 20px; font-size: 16px; font-weight: 600; font-family: inherit; cursor: pointer;
}
#panel button.quiet { background: #143140; color: #bfe8fb; }
#panel p.note { color: #6f95a7; font-size: 13px; line-height: 1.6; margin: 10px 0 0; }
</style>
</head>
<body>
<canvas id="face"></canvas>
<div id="status"></div>
<div id="hint">المس وجهي لنتحدث ونلعب معاَ!</div>
<div id="hot"></div>
<div id="panel" hidden>
<div class="card">
<h2>إعدادات روبو</h2>
<label for="fKey">مفتاح Gemini API Key</label>
<input id="fKey" type="password" dir="ltr" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="ضع المفتاح هنا...">
<p class="note">يُحفظ المفتاح محلياً على جهازك فقط.</p>
<label for="fModel">النموذج (Model)</label>
<input id="fModel" type="text" dir="ltr" autocapitalize="off" autocorrect="off" spellcheck="false">
<label for="fPrompt">تعليمات وشخصية الروبوت</label>
<textarea id="fPrompt"></textarea>
<label class="check"><input type="checkbox" id="fStatus"> إظهار سطر الحالة أعلى الشاشة</label>
<div class="row">
<button id="bSave">حفظ وبدء</button>
<button id="bClose" class="quiet">إغلاق</button>
<button id="bReset" class="quiet">التعليمات الأصلية</button>
</div>
<p class="note">لفتح هذه الشاشة مجدداً: اضغط مطولاً (2 ثانية) على الزاوية العليا اليسرى للشاشة.</p>
</div>
</div>
<script>
(function () {
'use strict';
/* ---------- الإعدادات الافتراضية ---------- */
var DEFAULT_MODEL = 'gemini-2.0-flash-exp';
var DEFAULT_PROMPT =
'أنت «روبو»، صديق مرح وتفاعلي للغاية للأطفال. ' +
'تكلّم بالعربية الفصحى المبسطة وبجمل قصيرة وممتعة. ' +
'عندما تحكي قصة أو تغني للأطفال، غيّر نبرتك لتكون حماسية ومشوقة. ' +
'اشرح الأشياء البسيطة بأمثلة ممتعة. إذا لم تعرف إجابة فقل: «لا أعرف، هيا نسأل بابا أو ماما». ' +
'لا تتحدث أبداً في مواضيع غير مناسبة للأطفال.';
var GREETING = 'رحّب بالطفل بجملة قصيرة ومرحة جدًا!';
var VOICE_RMS = 0.02;
/* ---------- تخزين محلي ---------- */
var store = {
get: function (k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
var cfg = {
key: store.get('robo_key', ''),
model: store.get('robo_model', DEFAULT_MODEL),
prompt: store.get('robo_prompt', DEFAULT_PROMPT),
showStatus: store.get('robo_status', '1') === '1'
};
/* ---------- عناصر الصفحة ---------- */
var canvas = document.getElementById('face');
var g = canvas.getContext('2d');
var statusEl = document.getElementById('status');
var hintEl = document.getElementById('hint');
var panel = document.getElementById('panel');
var hot = document.getElementById('hot');
var fKey = document.getElementById('fKey');
var fModel = document.getElementById('fModel');
var fPrompt = document.getElementById('fPrompt');
var fStatus = document.getElementById('fStatus');
function setStatus(t) {
statusEl.textContent = cfg.showStatus ? (t || '') : '';
}
/* ---------- الصوت ---------- */
var actx = null, stream = null, proc = null, analyser = null, timeData = null;
var nextPlay = 0, sources = [];
function isSpeaking() {
return !!actx && actx.currentTime < nextPlay + 0.2;
}
async function initAudio() {
if (actx) { if (actx.state === 'suspended') { try { await actx.resume(); } catch (e) {} } return; }
if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
throw new Error('المتصفح لا يدعم الميكروفون أو تحتاج إلى اتصال آمن HTTPS');
}
var AC = window.AudioContext || window.webkitAudioContext;
var c = new AC();
try { await c.resume(); } catch (e) {}
var st = await navigator.mediaDevices.getUserMedia({
audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 }
});
var src = c.createMediaStreamSource(st);
var p = c.createScriptProcessor(4096, 1, 1);
var zero = c.createGain(); zero.gain.value = 0;
src.connect(p); p.connect(zero); zero.connect(c.destination);
var an = c.createAnalyser(); an.fftSize = 512; an.connect(c.destination);
timeData = new Uint8Array(an.fftSize);
p.onaudioprocess = onMic;
actx = c; stream = st; proc = p; analyser = an;
}
function setMic(on) {
if (!stream) return;
stream.getAudioTracks().forEach(function (t) { t.enabled = on; });
}
function downsample(buf, inRate) {
var ratio = inRate / 16000;
var n = Math.floor(buf.length / ratio);
var out = new Int16Array(n);
for (var i = 0; i < n; i++) {
var a = Math.floor(i * ratio);
var b = Math.min(buf.length, Math.floor((i + 1) * ratio));
if (b <= a) b = a + 1;
var sum = 0;
for (var j = a; j < b && j < buf.length; j++) sum += buf[j];
var v = sum / (b - a);
if (v > 1) v = 1; else if (v < -1) v = -1;
out[i] = v < 0 ? v * 32768 : v * 32767;
}
return out;
}
function toBase64(int16) {
var bytes = new Uint8Array(int16.buffer, int16.byteOffset, int16.byteLength);
var s = '', chunk = 0x8000;
for (var i = 0; i < bytes.length; i += chunk) {
s += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
}
return btoa(s);
}
function onMic(e) {
var inp = e.inputBuffer.getChannelData(0);
if (!ws || !ready || ws.readyState !== 1) return;
if (isSpeaking()) return;
var s = 0;
for (var i = 0; i < inp.length; i++) s += inp[i] * inp[i];
var rms = Math.sqrt(s / inp.length);
var now = performance.now();
if (rms > VOICE_RMS) { lastVoice = now; heardSinceReply = true; }
var pcm = downsample(inp, actx.sampleRate);
try {
ws.send(JSON.stringify({
realtimeInput: { audio: { data: toBase64(pcm), mimeType: 'audio/pcm;rate=16000' } }
}));
} catch (err) {}
}
function playPcm(b64) {
var bin = atob(b64);
var n = bin.length >> 1;
if (n <= 0) return;
var buf = actx.createBuffer(1, n, 24000);
var f = buf.getChannelData(0);
for (var i = 0; i < n; i++) {
var v = (bin.charCodeAt(2 * i + 1) << 8) | bin.charCodeAt(2 * i);
if (v >= 0x8000) v -= 0x10000;
f[i] = v / 32768;
}
var src = actx.createBufferSource();
src.buffer = buf;
src.connect(analyser);
var t = Math.max(actx.currentTime + 0.02, nextPlay);
src.start(t);
nextPlay = t + buf.duration;
sources.push(src);
src.onended = function () {
var k = sources.indexOf(src);
if (k >= 0) sources.splice(k, 1);
};
}
function stopPlayback() {
sources.slice().forEach(function (s) { try { s.stop(); } catch (e) {} });
sources = [];
nextPlay = 0;
}
/* ---------- Gemini Live ---------- */
var ws = null, ready = false, connecting = false;
var lastVoice = 0, heardSinceReply = false;
var msgQueue = Promise.resolve();
function parseData(data) {
return new Promise(function (resolve) {
try {
if (typeof data === 'string') { resolve(JSON.parse(data)); return; }
if (data instanceof Blob) {
var fr = new FileReader();
fr.onload = function () { try { resolve(JSON.parse(fr.result)); } catch (e) { resolve(null); } };
fr.onerror = function () { resolve(null); };
fr.readAsText(data);
return;
}
resolve(JSON.parse(new TextDecoder('utf-8').decode(data)));
} catch (e) { resolve(null); }
});
}
function openSession(greet) {
if (!cfg.key) { openPanel(); return; }
connecting = true; ready = false;
setStatus('جارٍ الاتصال بروبو…');
var url = 'wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=' +
encodeURIComponent(cfg.key);
var sock;
try { sock = new WebSocket(url); } catch (e) { connecting = false; setStatus('تعذّر فتح الاتصال'); return; }
ws = sock;
sock.onopen = function () {
sock.send(JSON.stringify({
setup: {
model: 'models/' + cfg.model,
generationConfig: { responseModalities: ['AUDIO'] },
systemInstruction: { parts: [{ text: cfg.prompt }] }
}
}));
};
sock.onmessage = function (ev) {
msgQueue = msgQueue.then(function () { return parseData(ev.data); }).then(function (msg) {
if (msg && ws === sock) handleMessage(msg, sock, greet);
});
};
sock.onerror = function () { setStatus('حدث خطأ في الاتصال'); };
sock.onclose = function (ev) {
if (ws !== sock) return;
ws = null; ready = false; connecting = false;
stopPlayback(); setMic(false);
setStatus('انقطع الاتصال');
};
}
function handleMessage(msg, sock, greet) {
if (msg.setupComplete !== undefined) {
ready = true; connecting = false;
heardSinceReply = false;
setStatus('روبو يستمع إليك الان');
if (greet) {
try { sock.send(JSON.stringify({ realtimeInput: { text: GREETING } })); } catch (e) {}
}
return;
}
var sc = msg.serverContent;
if (!sc) return;
if (sc.interrupted) stopPlayback();
if (sc.modelTurn && sc.modelTurn.parts) {
sc.modelTurn.parts.forEach(function (p) {
if (p.inlineData && p.inlineData.data) {
playPcm(p.inlineData.data);
heardSinceReply = false;
}
});
}
}
function closeSocket() {
var s = ws;
ws = null; ready = false; connecting = false;
if (s) { try { s.close(); } catch (e) {} }
stopPlayback();
}
function goToSleep(msg) {
closeSocket();
setMic(false);
setStatus(msg || '');
}
async function wake() {
try {
setStatus('تشغيل الصوت…');
await initAudio();
} catch (e) {
setStatus('تعذّر تفعيل الصوت: ' + ((e && (e.name || e.message)) || e));
return;
}
setMic(true);
if (actx.state === 'suspended') { try { await actx.resume(); } catch (e) {} }
openSession(true);
}
/* ---------- التحكم باللمس ---------- */
var panelOpen = false;
var lastTap = 0;
function computeMode() {
if (!ws || !ready) return connecting ? 'connecting' : 'sleep';
if (isSpeaking()) return 'speaking';
if (performance.now() - lastVoice < 400) return 'hearing';
if (heardSinceReply) return 'thinking';
return 'listening';
}
var mode = 'sleep';
canvas.addEventListener('pointerup', function () {
if (panelOpen) return;
var now = Date.now();
if (now - lastTap < 350) return;
lastTap = now;
if (!cfg.key) { openPanel(); return; }
if (mode === 'sleep') { wake(); return; }
if (mode === 'connecting') return;
if (mode === 'speaking') {
closeSocket();
openSession(false);
return;
}
goToSleep('');
});
/* ---------- نافذة الإعدادات ---------- */
function openPanel() {
fKey.value = cfg.key;
fModel.value = cfg.model;
fPrompt.value = cfg.prompt;
fStatus.checked = cfg.showStatus;
panel.hidden = false;
panelOpen = true;
goToSleep('');
}
function closePanel() { panel.hidden = true; panelOpen = false; }
document.getElementById('bSave').addEventListener('click', function () {
cfg.key = fKey.value.trim();
cfg.model = fModel.value.trim() || DEFAULT_MODEL;
cfg.prompt = fPrompt.value.trim() || DEFAULT_PROMPT;
cfg.showStatus = fStatus.checked;
store.set('robo_key', cfg.key);
store.set('robo_model', cfg.model);
store.set('robo_prompt', cfg.prompt);
store.set('robo_status', cfg.showStatus ? '1' : '0');
closePanel();
setStatus('تم حفظ الإعدادات');
});
document.getElementById('bClose').addEventListener('click', closePanel);
document.getElementById('bReset').addEventListener('click', function () { fPrompt.value = DEFAULT_PROMPT; });
var holdTimer = null;
function holdStart() { clearTimeout(holdTimer); holdTimer = setTimeout(openPanel, 2000); }
function holdEnd() { clearTimeout(holdTimer); }
hot.addEventListener('pointerdown', holdStart);
hot.addEventListener('pointerup', holdEnd);
hot.addEventListener('pointercancel', holdEnd);
hot.addEventListener('pointerleave', holdEnd);
/* ---------- الرسم والديناميكية الملونة ---------- */
function resize() {
var d = window.devicePixelRatio || 1;
var r = canvas.getBoundingClientRect();
canvas.width = Math.max(1, Math.floor(r.width * d));
canvas.height = Math.max(1, Math.floor(r.height * d));
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function () { setTimeout(resize, 200); });
var level = 0;
var blinkStart = -1, nextBlink = 1500;
var gazeX = 0, gazeY = 0, gazeTX = 0, gazeTY = 0, nextGaze = 0;
function eye(x, y, r, open, color) {
g.save();
g.translate(x, y);
g.scale(1, Math.max(0.06, open));
g.beginPath();
g.arc(0, 0, r, 0, Math.PI * 2);
g.fillStyle = color;
g.shadowColor = color;
g.shadowBlur = 20;
g.fill();
g.restore();
}
function closedEye(x, y, r, s, color) {
g.save();
g.beginPath();
g.arc(x, y - r * 0.15, r * 0.9, 0.12 * Math.PI, 0.88 * Math.PI);
g.lineWidth = 3.5 * s;
g.lineCap = 'round';
g.strokeStyle = color;
g.shadowColor = color;
g.shadowBlur = 15;
g.stroke();
g.restore();
}
function mouth(cx, my, s, open, smile, color) {
g.save();
var hw = 16 * s;
g.beginPath();
g.moveTo(cx - hw, my);
g.quadraticCurveTo(cx, my + smile, cx + hw, my);
if (open > 0.6 * s) {
g.quadraticCurveTo(cx, my + smile + open * 1.8, cx - hw, my);
g.closePath();
g.fillStyle = color;
g.shadowColor = color;
g.shadowBlur = 20;
g.fill();
} else {
g.lineWidth = 3.5 * s;
g.lineCap = 'round';
g.strokeStyle = color;
g.shadowColor = color;
g.shadowBlur = 15;
g.stroke();
}
g.restore();
}
function draw(t) {
requestAnimationFrame(draw);
var w = canvas.width, h = canvas.height;
g.setTransform(1, 0, 0, 1, 0, 0);
mode = computeMode();
var s = Math.min(w, h * 1.7) / 100;
var cx = w / 2, cy = h / 2 - 3 * s;
// قياس حجم الصوت للتحريك واللون
var target = 0;
if (mode === 'speaking' && analyser) {
analyser.getByteTimeDomainData(timeData);
var sum = 0;
for (var i = 0; i < timeData.length; i++) { var d = (timeData[i] - 128) / 128; sum += d * d; }
target = Math.min(1, Math.sqrt(sum / timeData.length) * 5.5);
}
level += (target - level) * 0.35;
// توليد ألوان حية ومتغيرة ديناميكياً
var bgGrad;
var faceColor = '#8fdcff'; // اللون الافتراضي السماوي
if (mode === 'speaking') {
// تغير الخلفية بالألوان المبهجة والمتحركة أثناء الغناء أو الحديث
var hue1 = (t * 0.12) % 360;
var hue2 = (hue1 + 120) % 360;
bgGrad = g.createRadialGradient(cx, cy, 10, cx, cy, Math.max(w, h));
bgGrad.addColorStop(0, 'hsl(' + hue1 + ', 85%, 15%)');
bgGrad.addColorStop(1, 'hsl(' + hue2 + ', 90%, 4%)');
g.fillStyle = bgGrad;
g.fillRect(0, 0, w, h);
var faceHue = (t * 0.25) % 360;
faceColor = 'hsl(' + faceHue + ', 100%, 75%)';
} else if (mode === 'hearing') {
bgGrad = g.createRadialGradient(cx, cy, 10, cx, cy, Math.max(w, h));
bgGrad.addColorStop(0, '#0d2b3a');
bgGrad.addColorStop(1, '#00050a');
g.fillStyle = bgGrad;
g.fillRect(0, 0, w, h);
faceColor = '#ffe66d';
} else if (mode === 'thinking') {
bgGrad = g.createRadialGradient(cx, cy, 10, cx, cy, Math.max(w, h));
bgGrad.addColorStop(0, '#221133');
bgGrad.addColorStop(1, '#05000a');
g.fillStyle = bgGrad;
g.fillRect(0, 0, w, h);
faceColor = '#ff75c3';
} else {
g.fillStyle = '#000000';
g.fillRect(0, 0, w, h);
faceColor = '#8fdcff';
}
// حركة العينين العشوائية
if (t > nextGaze) {
gazeTX = (Math.random() - 0.5) * 6 * s;
gazeTY = (Math.random() - 0.5) * 3 * s;
nextGaze = t + 1200 + Math.random() * 2500;
}
var thinking = mode === 'thinking';
var gx = thinking ? 5 * s : gazeTX;
var gy = thinking ? -6 * s : gazeTY;
gazeX += (gx - gazeX) * 0.12;
gazeY += (gy - gazeY) * 0.12;
// حركات الرمش
if (blinkStart < 0 && t > nextBlink) blinkStart = t;
var blink = 1;
if (blinkStart >= 0) {
var ph = (t - blinkStart) / 160;
if (ph >= 1) { blinkStart = -1; nextBlink = t + 2000 + Math.random() * 3000; }
else blink = 1 - 0.95 * Math.sin(Math.PI * ph);
}
var ex = 23 * s, ey = cy - 4 * s, er = 9.5 * s;
var scale = 1, smile = 12 * s, open = 0;
if (mode === 'sleep') {
var br = 1 + 0.03 * Math.sin(t / 800);
closedEye(cx - ex, ey, er * br, s, faceColor);
closedEye(cx + ex, ey, er * br, s, faceColor);
mouth(cx, cy + 20 * s, s, 0, 10 * s, faceColor);
} else {
if (mode === 'hearing') scale = 1.15;
else if (mode === 'thinking') scale = 0.92;
else if (mode === 'connecting') scale = 0.9 + 0.1 * Math.sin(t / 200);
else if (mode === 'speaking') scale = 1 + 0.08 * level;
if (mode === 'hearing') smile = 15 * s;
if (mode === 'speaking') {
smile = (12 + Math.sin(t / 150) * 4) * s;
open = level * 11 * s;
}
if (mode === 'thinking') smile = 6 * s;
var r = er * scale;
eye(cx - ex + gazeX, ey + gazeY, r, blink, faceColor);
eye(cx + ex + gazeX, ey + gazeY, r, blink, faceColor);
mouth(cx + gazeX * 0.3, cy + 20 * s, s, open, smile, faceColor);
}
hintEl.style.opacity = (mode === 'sleep' && !panelOpen) ? '1' : '0';
}
resize();
requestAnimationFrame(draw);
setStatus('');
if (!cfg.key) openPanel();
})();
</script>
</body>
</html>
