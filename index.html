<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>روبو - Robo</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<style>
  html, body {
    margin: 0; height: 100%; background: #000000; overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    transition: background 0.8s ease;
  }
  #face { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; }
  #hint {
    position: fixed; left: 0; right: 0; bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    text-align: center; color: #8fdcff; font-size: 20px; pointer-events: none;
    transition: opacity .4s; text-shadow: 0 0 8px rgba(0,0,0,0.8);
  }
  #status {
    position: fixed; left: 0; right: 0; top: calc(6px + env(safe-area-inset-top, 0px));
    text-align: center; color: #7fadb3; font-size: 12px; pointer-events: none; direction: ltr;
  }
  #hot { position: fixed; top: 0; left: 0; width: 80px; height: 80px; z-index: 5; }

  #panel {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.94); display: flex;
    align-items: flex-start; justify-content: center; overflow-y: auto; z-index: 10;
    padding: calc(16px + env(safe-area-inset-top, 0px)) 16px 24px;
    box-sizing: border-box; -webkit-user-select: text; user-select: text;
  }
  #panel[hidden] { display: none; }
  #panel .card { width: 100%; max-width: 520px; color: #d7eef8; }
  #panel h2 { margin: 4px 0 14px; font-size: 20px; font-weight: 600; }
  #panel label { display: block; margin: 14px 0 6px; font-size: 14px; color: #8fdcff; }
  #panel input[type=password], #panel input[type=text], #panel textarea {
    width: 100%; box-sizing: border-box; background: #0b1a22; color: #eaf8ff;
    border: 1px solid #2b4a58; border-radius: 10px; padding: 10px 12px; font-size: 16px;
    font-family: inherit;
  }
  #panel textarea { min-height: 170px; line-height: 1.6; }
  #panel .check { display: flex; align-items: center; gap: 8px; color: #d7eef8; }
  #panel .row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
  #panel button {
    background: #8fdcff; color: #001018; border: 0; border-radius: 10px;
    padding: 11px 18px; font-size: 16px; font-family: inherit; cursor: pointer;
  }
  #panel button.quiet { background: #143140; color: #bfe8fb; }
  #panel p.note { color: #6f95a7; font-size: 13px; line-height: 1.6; margin: 8px 0 0; }
</style>
</head>
<body>
<canvas id="face"></canvas>
<div id="status"></div>
<div id="hint">المس وجهي لنتحدث</div>
<div id="hot"></div>

<div id="panel" hidden>
  <div class="card">
    <h2>إعدادات الأهل</h2>

    <label for="fKey">مفتاح Gemini API</label>
    <input id="fKey" type="password" dir="ltr" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <p class="note">يُحفظ على هذا الجهاز فقط ولا يوجد داخل ملف الصفحة.</p>

    <label for="fModel">النموذج</label>
    <input id="fModel" type="text" dir="ltr" autocapitalize="off" autocorrect="off" spellcheck="false">

    <label for="fPrompt">تعليمات الروبوت</label>
    <textarea id="fPrompt"></textarea>

    <label class="check"><input type="checkbox" id="fStatus"> إظهار سطر الحالة أعلى الشاشة (للتجربة)</label>

    <div class="row">
      <button id="bSave">حفظ</button>
      <button id="bClose" class="quiet">إغلاق</button>
      <button id="bReset" class="quiet">استعادة التعليمات الأصلية</button>
    </div>
    <p class="note">لفتح هذه النافذة لاحقًا: اضغط مطولًا (ثانيتين) على الزاوية العليا اليسرى من الشاشة.</p>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ---------- الإعدادات الافتراضية ---------- */
  var DEFAULT_MODEL = 'gemini-2.0-flash-exp';
  var DEFAULT_PROMPT =
    'أنت «روبو»، صديق ومرح للأطفال. ' +
    'تكلّم بالعربية الفصحى المبسطة وبجمل قصيرة وممتعة. ' +
    'عندما تغني أو تحكي قصة، عبّر بحماس وبشغف وسعادة. ' +
    'لا تتحدث عن موضوعات غير مناسبة للأطفال. اختم أحيانًا بسؤال بسيط ينمّي فضوله.';
  var GREETING = 'رحّب بالطفل بجملة قصيرة ومرحة.';
  var VOICE_RMS = 0.02;

  /* ---------- تخزين محلي آمن ---------- */
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  var cfg = {
    key: store.get('robo_key', ''),
    model: store.get('robo_model', DEFAULT_MODEL),
    prompt: store.get('robo_prompt', DEFAULT_PROMPT),
    showStatus: store.get('robo_status', '1') === '1'
  };

  /* ---------- عناصر الصفحة ---------- */
  var canvas = document.getElementById('face');
  var g = canvas.getContext('2d');
  var statusEl = document.getElementById('status');
  var hintEl = document.getElementById('hint');
  var panel = document.getElementById('panel');
  var hot = document.getElementById('hot');
  var fKey = document.getElementById('fKey');
  var fModel = document.getElementById('fModel');
  var fPrompt = document.getElementById('fPrompt');
  var fStatus = document.getElementById('fStatus');

  function setStatus(t) {
    statusEl.textContent = cfg.showStatus ? (t || '') : '';
  }

  /* ---------- نظام الصوت المتوافق مع iOS 15 ومحسّن للبفر ---------- */
  var actx = null, stream = null, proc = null, analyser = null, timeData = null;
  var nextPlay = 0;
  var audioQueue = [];
  var isPlayingAudio = false;

  function isSpeaking() {
    return isPlayingAudio || (!!actx && actx.currentTime < nextPlay);
  }

  async function initAudio() {
    if (actx) { if (actx.state === 'suspended') { try { await actx.resume(); } catch (e) {} } return; }
    
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) throw new Error('المتصفح لا يدعم الصوت الشبكي');
    var c = new AC();
    try { await c.resume(); } catch (e) {}

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error('المتصفح لا يدعم الميكروفون أو أذونات HTTPS');
    }

    var st = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 }
    });
    var src = c.createMediaStreamSource(st);
    var p = c.createScriptProcessor(4096, 1, 1);
    var zero = c.createGain(); zero.gain.value = 0;
    src.connect(p); p.connect(zero); zero.connect(c.destination);
    var an = c.createAnalyser(); an.fftSize = 512;
    timeData = new Uint8Array(an.fftSize);
    p.onaudioprocess = onMic;
    actx = c; stream = st; proc = p; analyser = an;
  }

  function setMic(on) {
    if (!stream) return;
    stream.getAudioTracks().forEach(function (t) { t.enabled = on; });
  }

  function downsample(buf, inRate) {
    var ratio = inRate / 16000;
    var n = Math.floor(buf.length / ratio);
    var out = new Int16Array(n);
    for (var i = 0; i < n; i++) {
      var a = Math.floor(i * ratio);
      var b = Math.min(buf.length, Math.floor((i + 1) * ratio));
      if (b <= a) b = a + 1;
      var sum = 0;
      for (var j = a; j < b && j < buf.length; j++) sum += buf[j];
      var v = sum / (b - a);
      if (v > 1) v = 1; else if (v < -1) v = -1;
      out[i] = v < 0 ? v * 32768 : v * 32767;
    }
    return out;
  }

  function toBase64(int16) {
    var bytes = new Uint8Array(int16.buffer, int16.byteOffset, int16.byteLength);
    var s = '', chunk = 0x8000;
    for (var i = 0; i < bytes.length; i += chunk) {
      s += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    }
    return btoa(s);
  }

  function onMic(e) {
    var inp = e.inputBuffer.getChannelData(0);
    if (!ws || !ready || ws.readyState !== 1) return;
    if (isSpeaking()) return;
    var s = 0;
    for (var i = 0; i < inp.length; i++) s += inp[i] * inp[i];
    var rms = Math.sqrt(s / inp.length);
    var now = performance.now();
    if (rms > VOICE_RMS) { lastVoice = now; heardSinceReply = true; }
    var pcm = downsample(inp, actx.sampleRate);
    try {
      ws.send(JSON.stringify({
        realtimeInput: { audio: { data: toBase64(pcm), mimeType: 'audio/pcm;rate=16000' } }
      }));
    } catch (err) {}
  }

  function playPcm(b64) {
    var bin = atob(b64);
    var n = bin.length >> 1;
    if (n <= 0) return;
    var buf = actx.createBuffer(1, n, 24000);
    var f = buf.getChannelData(0);
    for (var i = 0; i < n; i++) {
      var v = (bin.charCodeAt(2 * i + 1) << 8) | bin.charCodeAt(2 * i);
      if (v >= 0x8000) v -= 0x10000;
      f[i] = v / 32768;
    }

    audioQueue.push(buf);
    if (!isPlayingAudio) {
      processAudioQueue();
    }
  }

  function processAudioQueue() {
    if (audioQueue.length === 0) {
      isPlayingAudio = false;
      return;
    }
    isPlayingAudio = true;
    var buf = audioQueue.shift();
    var src = actx.createBufferSource();
    src.buffer = buf;
    src.connect(analyser);
    analyser.connect(actx.destination);

    var now = actx.currentTime;
    if (nextPlay < now) nextPlay = now + 0.01;

    src.start(nextPlay);
    nextPlay += buf.duration;

    src.onended = function () {
      processAudioQueue();
    };
  }

  function stopPlayback() {
    audioQueue = [];
    isPlayingAudio = false;
    nextPlay = 0;
  }

  /* ---------- الاتصال بـ Gemini Live ---------- */
  var ws = null, ready = false, connecting = false;
  var lastVoice = 0, heardSinceReply = false;
  var msgQueue = Promise.resolve();

  function parseData(data) {
    return new Promise(function (resolve) {
      try {
        if (typeof data === 'string') { resolve(JSON.parse(data)); return; }
        if (data instanceof Blob) {
          var fr = new FileReader();
          fr.onload = function () { try { resolve(JSON.parse(fr.result)); } catch (e) { resolve(null); } };
          fr.onerror = function () { resolve(null); };
          fr.readAsText(data);
          return;
        }
        resolve(JSON.parse(new TextDecoder('utf-8').decode(data)));
      } catch (e) { resolve(null); }
    });
  }

  function openSession(greet) {
    if (!cfg.key) { openPanel(); return; }
    connecting = true; ready = false;
    setStatus('جارٍ الاتصال…');
    var url = 'wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=' +
      encodeURIComponent(cfg.key);
    var sock;
    try { sock = new WebSocket(url); } catch (e) { connecting = false; setStatus('تعذّر فتح الاتصال'); return; }
    ws = sock;

    sock.onopen = function () {
      sock.send(JSON.stringify({
        setup: {
          model: 'models/' + cfg.model,
          generationConfig: { responseModalities: ['AUDIO'] },
          systemInstruction: { parts: [{ text: cfg.prompt }] }
        }
      }));
    };
    sock.onmessage = function (ev) {
      msgQueue = msgQueue.then(function () { return parseData(ev.data); }).then(function (msg) {
        if (msg && ws === sock) handleMessage(msg, sock, greet);
      });
    };
    sock.onerror = function () { setStatus('خطأ في الاتصال'); };
    sock.onclose = function (ev) {
      if (ws !== sock) return;
      ws = null; ready = false; connecting = false;
      stopPlayback(); setMic(false);
      setStatus('انقطع الاتصال (' + ev.code + ')');
    };
  }

  function handleMessage(msg, sock, greet) {
    if (msg.setupComplete !== undefined) {
      ready = true; connecting = false;
      heardSinceReply = false;
      setStatus('جاهز');
      if (greet) {
        try { sock.send(JSON.stringify({ realtimeInput: { text: GREETING } })); } catch (e) {}
      }
      return;
    }
    var sc = msg.serverContent;
    if (!sc) return;
    if (sc.interrupted) stopPlayback();
    if (sc.modelTurn && sc.modelTurn.parts) {
      sc.modelTurn.parts.forEach(function (p) {
        if (p.inlineData && p.inlineData.data) {
          playPcm(p.inlineData.data);
          heardSinceReply = false;
        }
      });
    }
  }

  function closeSocket() {
    var s = ws;
    ws = null; ready = false; connecting = false;
    if (s) { try { s.close(); } catch (e) {} }
    stopPlayback();
  }

  function goToSleep(msg) {
    closeSocket();
    setMic(false);
    setStatus(msg || 'متوقف');
  }

  async function wake() {
    try {
      setStatus('تشغيل الميكروفون…');
      await initAudio();
    } catch (e) {
      setStatus('تعذّر تشغيل الميكروفون: ' + ((e && (e.name || e.message)) || e));
      return;
    }
    setMic(true);
    if (actx && actx.state === 'suspended') { try { await actx.resume(); } catch (e) {} }
    openSession(true);
  }

  /* ---------- اللمس والتحكم ---------- */
  var panelOpen = false;
  var lastTap = 0;

  function computeMode() {
    if (!ws || !ready) return connecting ? 'connecting' : 'sleep';
    if (isSpeaking()) return 'speaking';
    if (performance.now() - lastVoice < 400) return 'hearing';
    if (heardSinceReply) return 'thinking';
    return 'listening';
  }
  var mode = 'sleep';

  canvas.addEventListener('pointerup', function () {
    if (panelOpen) return;
    var now = Date.now();
    if (now - lastTap < 350) return;
    lastTap = now;
    if (!cfg.key) { openPanel(); return; }
    if (mode === 'sleep') { wake(); return; }
    if (mode === 'connecting') return;
    if (mode === 'speaking') {
      closeSocket();
      openSession(false);
      return;
    }
    goToSleep('متوقف');
  });

  /* ---------- نافذة الإعدادات ---------- */
  function openPanel() {
    fKey.value = cfg.key;
    fModel.value = cfg.model;
    fPrompt.value = cfg.prompt;
    fStatus.checked = cfg.showStatus;
    panel.hidden = false;
    panelOpen = true;
    goToSleep('');
  }
  function closePanel() { panel.hidden = true; panelOpen = false; }

  document.getElementById('bSave').addEventListener('click', function () {
    cfg.key = fKey.value.trim();
    cfg.model = fModel.value.trim() || DEFAULT_MODEL;
    cfg.prompt = fPrompt.value.trim() || DEFAULT_PROMPT;
    cfg.showStatus = fStatus.checked;
    store.set('robo_key', cfg.key);
    store.set('robo_model', cfg.model);
    store.set('robo_prompt', cfg.prompt);
    store.set('robo_status', cfg.showStatus ? '1' : '0');
    closePanel();
    setStatus('تم الحفظ');
  });
  document.getElementById('bClose').addEventListener('click', closePanel);
  document.getElementById('bReset').addEventListener('click', function () { fPrompt.value = DEFAULT_PROMPT; });

  var holdTimer = null;
  function holdStart() { clearTimeout(holdTimer); holdTimer = setTimeout(openPanel, 2000); }
  function holdEnd() { clearTimeout(holdTimer); }
  hot.addEventListener('pointerdown', holdStart);
  hot.addEventListener('pointerup', holdEnd);
  hot.addEventListener('pointercancel', holdEnd);
  hot.addEventListener('pointerleave', holdEnd);

  /* ---------- رسم العيون الكاملة باللون الأبيض والأسود والحدقة المطابقة للصورة ---------- */
  function resize() {
    var d = window.devicePixelRatio || 1;
    var r = canvas.getBoundingClientRect();
    canvas.width = Math.max(1, Math.floor(r.width * d));
    canvas.height = Math.max(1, Math.floor(r.height * d));
  }
  window.addEventListener('resize', resize);

  var level = 0;
  var blinkStart = -1, nextBlink = 1500;
  var gazeX = 0, gazeY = 0, gazeTX = 0, gazeTY = 0, nextGaze = 0;

  var accentColor = '#38b6ff'; // اللون السماوي للربط والحواجب

  // دالة رسم بيضاوي رسمية متوافقة مع المتصفحات القديمة (iOS 15 Safari)
  function drawEllipse(ctx, x, y, rx, ry) {
    ctx.beginPath();
    if (ctx.ellipse) {
      ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
    } else {
      // إرجاع متوافق في حال غياب دالة ellipse
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(rx, ry);
      ctx.arc(0, 0, 1, 0, Math.PI * 2);
      ctx.restore();
    }
  }

  // رسم العين الكاملة مثل الصورة تماماً
  function drawRealisticEye(cx, cy, radiusX, radiusY, gazeOffsetX, gazeOffsetY, blinkScale) {
    g.save();
    g.translate(cx, cy);
    g.scale(1, Math.max(0.04, blinkScale));

    // 1. بياض العين البيضاوي الكبير
    drawEllipse(g, 0, 0, radiusX, radiusY);
    g.fillStyle = '#FFFFFF';
    g.fill();
    g.lineWidth = 2;
    g.strokeStyle = '#1a1a1a';
    g.stroke();

    if (blinkScale > 0.1) {
      // 2. حدقة العين (القزحية والبؤبؤ)
      var irisX = gazeOffsetX * 0.8;
      var irisY = gazeOffsetY * 0.8;
      var irisRadius = radiusY * 0.58;

      // أ- الحلقة الخارجية للقزحية (أزرق سماوي ناعم)
      g.beginPath();
      g.arc(irisX, irisY, irisRadius, 0, Math.PI * 2);
      g.fillStyle = '#2b78c5';
      g.fill();

      // ب- القزحية الداخلية (بني دافئ/عسلي)
      g.beginPath();
      g.arc(irisX, irisY, irisRadius * 0.85, 0, Math.PI * 2);
      var grad = g.createRadialGradient(irisX, irisY, 0, irisX, irisY, irisRadius * 0.85);
      grad.addColorStop(0, '#5a2a0a');
      grad.addColorStop(0.7, '#803c0d');
      grad.addColorStop(1, '#3b1803');
      g.fillStyle = grad;
      g.fill();

      // ج- الحلقة البرتقالية المحيطة بالبؤبؤ
      g.beginPath();
      g.arc(irisX, irisY, irisRadius * 0.45, 0, Math.PI * 2);
      g.fillStyle = '#d97724';
      g.fill();

      // د- البؤبؤ الأسود في المنتصف
      g.beginPath();
      g.arc(irisX, irisY, irisRadius * 0.32, 0, Math.PI * 2);
      g.fillStyle = '#0a0a0d';
      g.fill();

      // هـ- لمعة العين البيضاء العلوية (Reflection 1)
      g.beginPath();
      g.arc(irisX - irisRadius * 0.32, irisY - irisRadius * 0.32, irisRadius * 0.22, 0, Math.PI * 2);
      g.fillStyle = 'rgba(255, 255, 255, 0.95)';
      g.fill();

      // و- لمعة العين البيضاء السفلية الصغرى (Reflection 2)
      g.beginPath();
      g.arc(irisX + irisRadius * 0.3, irisY + irisRadius * 0.3, irisRadius * 0.1, 0, Math.PI * 2);
      g.fillStyle = 'rgba(255, 255, 255, 0.75)';
      g.fill();
    }

    g.restore();
  }

  // رسم الحاجب السماوي مثل الصورة تماماً
  function drawEyebrow(x, y, w, h, angle, color) {
    g.save();
    g.translate(x, y);
    g.rotate(angle);

    g.beginPath();
    g.moveTo(-w / 2, 0);
    g.bezierCurveTo(-w / 4, -h, w / 4, -h, w / 2, 0);
    g.bezierCurveTo(w / 4, -h * 0.3, -w / 4, -h * 0.3, -w / 2, 0);
    g.closePath();

    var grad = g.createLinearGradient(-w / 2, 0, w / 2, 0);
    grad.addColorStop(0, color);
    grad.addColorStop(0.5, '#7dd3fc');
    grad.addColorStop(1, color);

    g.fillStyle = grad;
    g.shadowColor = color;
    g.shadowBlur = 10;
    g.fill();
    g.restore();
  }

  // رسم الفم البسيط الملون
  function mouth(cx, my, s, open, smile, color) {
    var hw = 18 * s;
    g.save();
    g.beginPath();
    g.moveTo(cx - hw, my);
    g.quadraticCurveTo(cx, my + smile, cx + hw, my);

    if (open > 0.6 * s) {
      g.quadraticCurveTo(cx, my + smile + open * 1.8, cx - hw, my);
      g.closePath();
      g.fillStyle = color;
      g.shadowColor = color;
      g.shadowBlur = 12;
      g.fill();
    } else {
      g.lineWidth = 4 * s;
      g.lineCap = 'round';
      g.strokeStyle = color;
      g.shadowColor = color;
      g.shadowBlur = 10;
      g.stroke();
    }
    g.restore();
  }

  function draw(t) {
    requestAnimationFrame(draw);
    var w = canvas.width, h = canvas.height;
    g.setTransform(1, 0, 0, 1, 0, 0);

    mode = computeMode();
    var s = Math.min(w, h * 1.7) / 100;
    var cx = w / 2, cy = h / 2 - 2 * s;

    // حساب مستوى الصوت
    var target = 0;
    if (mode === 'speaking' && analyser) {
      analyser.getByteTimeDomainData(timeData);
      var sum = 0;
      for (var i = 0; i < timeData.length; i++) { var d = (timeData[i] - 128) / 128; sum += d * d; }
      target = Math.min(1, Math.sqrt(sum / timeData.length) * 5.5);
    }
    level += (target - level) * 0.35;

    // ألوان الخلفية المبهجة وتفاعل الحواجب
    if (mode === 'speaking') {
      var hue = (t * 0.12) % 360;
      var bgHue = (hue + 180) % 360;
      document.body.style.background = 'radial-gradient(circle at center, hsl(' + bgHue + ', 40%, 15%) 0%, #000000 90%)';
      accentColor = 'hsl(' + hue + ', 100%, 65%)';
    } else {
      document.body.style.background = '#000000';
      accentColor = '#38b6ff';
    }

    g.clearRect(0, 0, w, h);

    // حركات ونظرات العينين العشوائية
    if (t > nextGaze) {
      gazeTX = (Math.random() - 0.5) * 8 * s;
      gazeTY = (Math.random() - 0.5) * 4 * s;
      nextGaze = t + 1400 + Math.random() * 2600;
    }
    var thinking = mode === 'thinking';
    var gx = thinking ? 5 * s : gazeTX;
    var gy = thinking ? -6 * s : gazeTY;
    gazeX += (gx - gazeX) * 0.12;
    gazeY += (gy - gazeY) * 0.12;

    // أنيميشن الرمش
    if (blinkStart < 0 && t > nextBlink) blinkStart = t;
    var blink = 1;
    if (blinkStart >= 0) {
      var ph = (t - blinkStart) / 160;
      if (ph >= 1) { blinkStart = -1; nextBlink = t + 2500 + Math.random() * 3500; }
      else blink = 1 - 0.95 * Math.sin(Math.PI * ph);
    }

    // إحداثيات ومقاسات العيون المماثلة للصورة
    var eyeSpacing = 24 * s;
    var eyeY = cy - 2 * s;
    var radiusX = 14 * s;
    var radiusY = 17 * s;

    var browW = 20 * s;
    var browH = 9 * s;
    var browY = eyeY - radiusY - 8 * s;

    var smile = 14 * s, open = 0;

    if (mode === 'speaking') {
      smile = (12 + level * 6) * s;
      open = level * 12 * s;
    }

    if (mode === 'sleep') {
      // رسم العين المغلقة في حالة التوقف
      drawRealisticEye(cx - eyeSpacing, eyeY, radiusX, radiusY, 0, 0, 0.05);
      drawRealisticEye(cx + eyeSpacing, eyeY, radiusX, radiusY, 0, 0, 0.05);
      drawEyebrow(cx - eyeSpacing, browY + 4 * s, browW, browH * 0.7, 0.05, accentColor);
      drawEyebrow(cx + eyeSpacing, browY + 4 * s, browW, browH * 0.7, -0.05, accentColor);
      mouth(cx, cy + 24 * s, s, 0, 10 * s, accentColor);
    } else {
      // العينان المكتملتان
      drawRealisticEye(cx - eyeSpacing, eyeY, radiusX, radiusY, gazeX, gazeY, blink);
      drawRealisticEye(cx + eyeSpacing, eyeY, radiusX, radiusY, gazeX, gazeY, blink);

      // الحواجب المرتفعة والتفاعلية
      var browAngleLeft = -0.12 + (gazeY * 0.01);
      var browAngleRight = 0.12 - (gazeY * 0.01);

      drawEyebrow(cx - eyeSpacing + gazeX * 0.3, browY + gazeY * 0.3, browW, browH, browAngleLeft, accentColor);
      drawEyebrow(cx + eyeSpacing + gazeX * 0.3, browY + gazeY * 0.3, browW, browH, browAngleRight, accentColor);

      // الفم
      mouth(cx + gazeX * 0.2, cy + 24 * s, s, open, smile, accentColor);
    }

    hintEl.style.opacity = (mode === 'sleep' && !panelOpen) ? '1' : '0';
  }

  resize();
  requestAnimationFrame(draw);
  setStatus('');
  if (!cfg.key) openPanel();
})();
</script>
</body>
</html>
