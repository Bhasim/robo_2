<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>روبو</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<style>
  html, body {
    margin: 0; height: 100%; background: #000; overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    font-family: -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
  }
  #face { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; }
  #hint {
    position: fixed; left: 0; right: 0; bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    text-align: center; color: #5b8fa6; font-size: 20px; pointer-events: none;
    transition: opacity .4s;
  }
  #status {
    position: fixed; left: 0; right: 0; top: calc(6px + env(safe-area-inset-top, 0px));
    text-align: center; color: #3f5d6b; font-size: 12px; pointer-events: none; direction: ltr;
  }
  #hot { position: fixed; top: 0; left: 0; width: 80px; height: 80px; }

  #panel {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.94); display: flex;
    align-items: flex-start; justify-content: center; overflow-y: auto; z-index: 10;
    padding: calc(16px + env(safe-area-inset-top, 0px)) 16px 24px;
    box-sizing: border-box; -webkit-user-select: text; user-select: text;
  }
  #panel[hidden] { display: none; }
  #panel .card { width: 100%; max-width: 520px; color: #d7eef8; }
  #panel h2 { margin: 4px 0 14px; font-size: 20px; font-weight: 600; }
  #panel label { display: block; margin: 14px 0 6px; font-size: 14px; color: #8fdcff; }
  #panel input[type=password], #panel input[type=text], #panel textarea {
    width: 100%; box-sizing: border-box; background: #0b1a22; color: #eaf8ff;
    border: 1px solid #2b4a58; border-radius: 10px; padding: 10px 12px; font-size: 16px;
    font-family: inherit;
  }
  #panel textarea { min-height: 170px; line-height: 1.6; }
  #panel .check { display: flex; align-items: center; gap: 8px; color: #d7eef8; }
  #panel .row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
  #panel button {
    background: #8fdcff; color: #001018; border: 0; border-radius: 10px;
    padding: 11px 18px; font-size: 16px; font-family: inherit;
  }
  #panel button.quiet { background: #143140; color: #bfe8fb; }
  #panel p.note { color: #6f95a7; font-size: 13px; line-height: 1.6; margin: 8px 0 0; }

  #quick button { -webkit-appearance:none; box-shadow:0 2px 10px rgba(0,0,0,.25); }
  #quick button:active { transform:scale(.94); }
  @media (max-width:520px){ #panel .card{max-width:none;} #panel button{min-height:44px;} }
</style>
</head>
<body>
<canvas id="face"></canvas>
<div id="status"></div>
<div id="hint">المس وجهي لنتحدث</div>
<div id="hot"></div>
<div id="quick" style="position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:5;display:flex;gap:7px;direction:ltr">
  <button id="settingsBtn" style="border:0;border-radius:12px;padding:9px 11px;background:rgba(15,30,40,.86);color:#dff7ff;font-size:16px">⚙️</button>
  <button id="sceneBtn" style="border:0;border-radius:12px;padding:9px 11px;background:rgba(15,30,40,.86);color:#dff7ff;font-size:16px">☀️</button>
</div>

<div id="panel" hidden>
  <div class="card">
    <h2>إعدادات الأهل</h2>

    <label for="fKey">مفتاح Gemini API</label>
    <div style="display:flex;gap:8px;direction:ltr"><input id="fKey" style="flex:1" type="password" dir="ltr" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"><button id="showKey" type="button" style="min-width:48px">👁</button></div>
    <p class="note">يُحفظ على هذا الجهاز فقط ولا يوجد داخل ملف الصفحة.</p>

    <label for="fModel">النموذج</label>
    <input id="fModel" type="text" dir="ltr" autocapitalize="off" autocorrect="off" spellcheck="false">

    <label for="fPrompt">تعليمات الروبوت</label>
    <textarea id="fPrompt"></textarea>

    <label class="check"><input type="checkbox" id="fStatus"> إظهار سطر الحالة أعلى الشاشة (للتجربة)</label>

    <div class="row">
      <button id="bSave">حفظ</button>
      <button id="bClose" class="quiet">إغلاق</button>
      <button id="bReset" class="quiet">استعادة التعليمات الأصلية</button>
    </div>
    <p class="note">لفتح هذه النافذة لاحقًا: اضغط مطولًا (ثانيتين) على الزاوية العليا اليسرى من الشاشة.</p>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ---------- الإعدادات الافتراضية ---------- */
  var DEFAULT_MODEL = 'gemini-3.8-live';
  var DEFAULT_PROMPT =
    'أنت «روبو»، صديق ومعلّم علوم للأطفال بين 5 و10 سنوات. ' +
    'تكلّم بالعربية الفصحى المبسطة وبجمل قصيرة (من جملتين إلى أربع). ' +
    'اشرح الأسئلة العلمية البسيطة بأمثلة من حياة الطفل اليومية. ' +
    'إن لم تكن متأكدًا فقل: «لا أعرف، هيا نسأل بابا أو ماما». ' +
    'لا تتحدث عن موضوعات غير مناسبة للأطفال، وإن سأل عنها فاعتذر بلطف وحوّل الحديث إلى شيء ممتع. ' +
    'لا تطلب من الطفل أي معلومات شخصية. اختم أحيانًا بسؤال بسيط ينمّي فضوله.';
  var GREETING = 'رحّب بالطفل بجملة قصيرة ومرحة.';
  // لا يوجد نوم تلقائي بسبب عدم النشاط.
  var VOICE_RMS = 0.02;         // عتبة محلية لتحريك الوجه عند سماع صوت
  var EYE = '#8fdcff';
  var PALETTE = { sleep:'#8fdcff', hearing:'#49e6a8', thinking:'#ffd166', speaking:'#ff6b8a', connecting:'#b28cff', listening:'#5cc8ff' };
  var sceneMode = 'day';
  var moodPulse = 0;

  /* ---------- تخزين محلي آمن ---------- */
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  var cfg = {
    key: store.get('robo_key', ''),
    model: store.get('robo_model', DEFAULT_MODEL),
    prompt: store.get('robo_prompt', DEFAULT_PROMPT),
    showStatus: store.get('robo_status', '1') === '1'
  };

  /* ---------- عناصر الصفحة ---------- */
  var canvas = document.getElementById('face');
  var g = canvas.getContext('2d');
  var statusEl = document.getElementById('status');
  var hintEl = document.getElementById('hint');
  var panel = document.getElementById('panel');
  var hot = document.getElementById('hot');
  var fKey = document.getElementById('fKey');
  var fModel = document.getElementById('fModel');
  var fPrompt = document.getElementById('fPrompt');
  var fStatus = document.getElementById('fStatus');

  function setStatus(t) {
    statusEl.textContent = cfg.showStatus ? (t || '') : '';
  }

  /* ---------- الصوت ---------- */
  var actx = null, stream = null, proc = null, analyser = null, timeData = null;
  var nextPlay = 0, sources = [];

  function isSpeaking() {
    return !!actx && actx.currentTime < nextPlay + 0.4;
  }

  async function initAudio() {
    if (actx) { if (actx.state === 'suspended') { try { await actx.resume(); } catch (e) {} } return; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error('المتصفح لا يدعم الميكروفون أو الصفحة ليست على HTTPS');
    }
    var AC = window.AudioContext || window.webkitAudioContext;
    var c = new AC();
    try { await c.resume(); } catch (e) {}
    var st = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 }
    });
    var src = c.createMediaStreamSource(st);
    var p = c.createScriptProcessor(4096, 1, 1);
    var zero = c.createGain(); zero.gain.value = 0;
    src.connect(p); p.connect(zero); zero.connect(c.destination);
    var an = c.createAnalyser(); an.fftSize = 512; an.connect(c.destination);
    timeData = new Uint8Array(an.fftSize);
    p.onaudioprocess = onMic;
    actx = c; stream = st; proc = p; analyser = an;
  }

  function setMic(on) {
    if (!stream) return;
    stream.getAudioTracks().forEach(function (t) { t.enabled = on; });
  }

  function downsample(buf, inRate) {
    var ratio = inRate / 16000;
    var n = Math.floor(buf.length / ratio);
    var out = new Int16Array(n);
    for (var i = 0; i < n; i++) {
      var a = Math.floor(i * ratio);
      var b = Math.min(buf.length, Math.floor((i + 1) * ratio));
      if (b <= a) b = a + 1;
      var sum = 0;
      for (var j = a; j < b && j < buf.length; j++) sum += buf[j];
      var v = sum / (b - a);
      if (v > 1) v = 1; else if (v < -1) v = -1;
      out[i] = v < 0 ? v * 32768 : v * 32767;
    }
    return out;
  }

  function toBase64(int16) {
    var bytes = new Uint8Array(int16.buffer, int16.byteOffset, int16.byteLength);
    var s = '', chunk = 0x8000;
    for (var i = 0; i < bytes.length; i += chunk) {
      s += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    }
    return btoa(s);
  }

  function onMic(e) {
    var inp = e.inputBuffer.getChannelData(0);
    if (!ws || !ready || ws.readyState !== 1) return;
    if (isSpeaking()) return;                 // نصف مزدوج: لا نرسل الصوت أثناء كلام الروبوت
    var s = 0;
    for (var i = 0; i < inp.length; i++) s += inp[i] * inp[i];
    var rms = Math.sqrt(s / inp.length);
    var now = performance.now();
    if (rms > VOICE_RMS) { lastVoice = now; heardSinceReply = true; lastActivity = now; }
    var pcm = downsample(inp, actx.sampleRate);
    try {
      ws.send(JSON.stringify({
        realtimeInput: { audio: { data: toBase64(pcm), mimeType: 'audio/pcm;rate=16000' } }
      }));
    } catch (err) {}
  }

  function playPcm(b64) {
    var bin = atob(b64);
    var n = bin.length >> 1;
    if (n <= 0) return;
    var buf = actx.createBuffer(1, n, 24000);
    var f = buf.getChannelData(0);
    for (var i = 0; i < n; i++) {
      var v = (bin.charCodeAt(2 * i + 1) << 8) | bin.charCodeAt(2 * i);
      if (v >= 0x8000) v -= 0x10000;
      f[i] = v / 32768;
    }
    var src = actx.createBufferSource();
    src.buffer = buf;
    src.connect(analyser);
    var t = Math.max(actx.currentTime + 0.03, nextPlay);
    src.start(t);
    nextPlay = t + buf.duration;
    sources.push(src);
    src.onended = function () {
      var k = sources.indexOf(src);
      if (k >= 0) sources.splice(k, 1);
    };
  }

  function stopPlayback() {
    sources.slice().forEach(function (s) { try { s.stop(); } catch (e) {} });
    sources = [];
    nextPlay = 0;
  }

  /* ---------- الاتصال بـ Gemini Live ---------- */
  var ws = null, ready = false, connecting = false;
  var lastVoice = 0, heardSinceReply = false, lastActivity = 0;
  var msgQueue = Promise.resolve();

  function parseData(data) {
    return new Promise(function (resolve) {
      try {
        if (typeof data === 'string') { resolve(JSON.parse(data)); return; }
        if (data instanceof Blob) {
          var fr = new FileReader();
          fr.onload = function () { try { resolve(JSON.parse(fr.result)); } catch (e) { resolve(null); } };
          fr.onerror = function () { resolve(null); };
          fr.readAsText(data);
          return;
        }
        resolve(JSON.parse(new TextDecoder('utf-8').decode(data)));
      } catch (e) { resolve(null); }
    });
  }

  function openSession(greet) {
    if (!cfg.key) { openPanel(); return; }
    connecting = true; ready = false;
    setStatus('جارٍ الاتصال…');
    var url = 'wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=' +
      encodeURIComponent(cfg.key);
    var sock;
    try { sock = new WebSocket(url); } catch (e) { connecting = false; setStatus('تعذّر فتح الاتصال'); return; }
    ws = sock;

    sock.onopen = function () {
      sock.send(JSON.stringify({
        setup: {
          model: 'models/' + cfg.model,
          generationConfig: { responseModalities: ['AUDIO'] },
          systemInstruction: { parts: [{ text: cfg.prompt }] }
        }
      }));
    };
    sock.onmessage = function (ev) {
      msgQueue = msgQueue.then(function () { return parseData(ev.data); }).then(function (msg) {
        if (msg && ws === sock) handleMessage(msg, sock, greet);
      });
    };
    sock.onerror = function () { setStatus('خطأ في الاتصال'); };
    sock.onclose = function (ev) {
      if (ws !== sock) return;
      ws = null; ready = false; connecting = false;
      stopPlayback(); setMic(false);
      setStatus('انقطع الاتصال (' + ev.code + (ev.reason ? ' – ' + ev.reason : '') + ')');
    };
  }

  function handleMessage(msg, sock, greet) {
    var now = performance.now();
    if (msg.setupComplete !== undefined) {
      ready = true; connecting = false;
      heardSinceReply = false; lastActivity = now;
      setStatus('جاهز');
      if (greet) {
        try { sock.send(JSON.stringify({ realtimeInput: { text: GREETING } })); } catch (e) {}
      }
      return;
    }
    var sc = msg.serverContent;
    if (!sc) return;
    if (sc.interrupted) stopPlayback();
    if (sc.modelTurn && sc.modelTurn.parts) {
      sc.modelTurn.parts.forEach(function (p) {
        if (p.inlineData && p.inlineData.data) {
          playPcm(p.inlineData.data);
          heardSinceReply = false;
          lastActivity = now;
        }
      });
    }
    if (sc.turnComplete) lastActivity = now;
  }

  function closeSocket() {
    var s = ws;
    ws = null; ready = false; connecting = false;
    if (s) { try { s.close(); } catch (e) {} }
    stopPlayback();
  }

  function goToSleep(msg) {
    closeSocket();
    setMic(false);
    setStatus(msg || 'نائم');
  }

  async function wake() {
    try {
      setStatus('تشغيل الميكروفون…');
      await initAudio();
    } catch (e) {
      setStatus('تعذّر تشغيل الميكروفون: ' + ((e && (e.name || e.message)) || e));
      return;
    }
    setMic(true);
    if (actx.state === 'suspended') { try { await actx.resume(); } catch (e) {} }
    openSession(true);
  }

  /* ---------- اللمس ---------- */
  var panelOpen = false;
  var lastTap = 0;

  function computeMode() {
    if (!ws || !ready) return connecting ? 'connecting' : 'sleep';
    if (isSpeaking()) return 'speaking';
    if (performance.now() - lastVoice < 400) return 'hearing';
    if (heardSinceReply) return 'thinking';
    return 'listening';
  }
  var mode = 'sleep';

  canvas.addEventListener('pointerup', function () {
    if (panelOpen) return;
    var now = Date.now();
    if (now - lastTap < 350) return;
    lastTap = now;
    if (!cfg.key) { openPanel(); return; }
    // هالة ملونة حسب الحالة
    g.save(); g.globalAlpha=.22; g.fillStyle=accent; g.beginPath(); g.arc(cx,cy,38*s+level*8*s,0,Math.PI*2); g.fill(); g.restore();

    if (mode === 'sleep') { wake(); return; }
    if (mode === 'connecting') return;
    if (mode === 'speaking') {                // مقاطعة: نعيد الجلسة بهدوء دون ترحيب
      closeSocket();
      openSession(false);
      return;
    }
    goToSleep('نائم');
  });

  /* ---------- نافذة إعدادات الأهل ---------- */
  function openPanel() {
    fKey.value = cfg.key;
    fModel.value = cfg.model;
    fPrompt.value = cfg.prompt;
    fStatus.checked = cfg.showStatus;
    panel.hidden = false;
    panelOpen = true;
    goToSleep('');
  }
  function closePanel() { panel.hidden = true; panelOpen = false; }

  document.getElementById('bSave').addEventListener('click', function () {
    cfg.key = fKey.value.trim();
    cfg.model = fModel.value.trim() || DEFAULT_MODEL;
    cfg.prompt = fPrompt.value.trim() || DEFAULT_PROMPT;
    cfg.showStatus = fStatus.checked;
    store.set('robo_key', cfg.key);
    store.set('robo_model', cfg.model);
    store.set('robo_prompt', cfg.prompt);
    store.set('robo_status', cfg.showStatus ? '1' : '0');
    closePanel();
    setStatus('تم الحفظ');
  });
  document.getElementById('bClose').addEventListener('click', closePanel);
  document.getElementById('bReset').addEventListener('click', function () { fPrompt.value = DEFAULT_PROMPT; });

  var holdTimer = null;
  function holdStart() { clearTimeout(holdTimer); holdTimer = setTimeout(openPanel, 2000); }
  function holdEnd() { clearTimeout(holdTimer); }
  hot.addEventListener('pointerdown', holdStart);
  hot.addEventListener('pointerup', holdEnd);
  hot.addEventListener('pointercancel', holdEnd);
  hot.addEventListener('pointerleave', holdEnd);

  document.getElementById('settingsBtn').addEventListener('click', openPanel);
  document.getElementById('sceneBtn').addEventListener('click', function(){
    sceneMode = sceneMode === 'day' ? 'night' : 'day';
    this.textContent = sceneMode === 'day' ? '☀️' : '🌙';
  });
  document.getElementById('showKey').addEventListener('click', function(){
    fKey.type = fKey.type === 'password' ? 'text' : 'password';
    this.textContent = fKey.type === 'password' ? '👁' : '🙈';
  });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) goToSleep('نائم');
  });

  /* ---------- الرسم ---------- */
  function resize() {
    var d = window.devicePixelRatio || 1;
    var r = canvas.getBoundingClientRect();
    canvas.width = Math.max(1, Math.floor(r.width * d));
    canvas.height = Math.max(1, Math.floor(r.height * d));
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 200); });

  var level = 0;
  var blinkStart = -1, nextBlink = 1500;
  var gazeX = 0, gazeY = 0, gazeTX = 0, gazeTY = 0, nextGaze = 0;

  function eye(x, y, r, open) {
    g.save();
    g.translate(x, y);
    g.scale(1, Math.max(0.06, open));
    g.beginPath();
    g.arc(0, 0, r, 0, Math.PI * 2);
    g.fillStyle = EYE;
    g.fill();
    g.restore();
  }

  function closedEye(x, y, r, s) {
    g.beginPath();
    g.arc(x, y - r * 0.15, r * 0.9, 0.12 * Math.PI, 0.88 * Math.PI);
    g.lineWidth = 2.6 * s;
    g.lineCap = 'round';
    g.strokeStyle = EYE;
    g.stroke();
  }

  function mouth(cx, my, s, open, smile) {
    var hw = 15 * s;
    g.beginPath();
    g.moveTo(cx - hw, my);
    g.quadraticCurveTo(cx, my + smile, cx + hw, my);
    if (open > 0.7 * s) {
      g.quadraticCurveTo(cx, my + smile + open * 1.7, cx - hw, my);
      g.closePath();
      g.fillStyle = EYE;
      g.fill();
    } else {
      g.lineWidth = 2.8 * s;
      g.lineCap = 'round';
      g.strokeStyle = EYE;
      g.stroke();
    }
  }

  function scene(t,w,h,cx,cy,s) {
    var night = sceneMode === 'night';
    g.save();
    g.globalAlpha = .95;
    g.fillStyle = night ? '#071225' : '#071b24';
    g.fillRect(0,0,w,h);
    if (night) {
      g.fillStyle='#f7e7a6'; g.beginPath(); g.arc(w-55*s,55*s,18*s,0,Math.PI*2); g.fill();
      g.fillStyle='#071225'; g.beginPath(); g.arc(w-48*s,50*s,18*s,0,Math.PI*2); g.fill();
      g.fillStyle='#fff4b8'; for(var i=0;i<18;i++){var sx=(i*83%w), sy=(i*47%Math.max(1,h)); g.fillRect(sx,sy,2*s,2*s);}
    } else {
      g.fillStyle='#ffd166'; g.beginPath(); g.arc(w-55*s,55*s,22*s,0,Math.PI*2); g.fill();
      g.strokeStyle='#ffd166'; g.lineWidth=2*s; for(var a=0;a<8;a++){var q=a*Math.PI/4; g.beginPath(); g.moveTo(w-55*s+29*s*Math.cos(q),55*s+29*s*Math.sin(q)); g.lineTo(w-55*s+38*s*Math.cos(q),55*s+38*s*Math.sin(q)); g.stroke();}
    }
    // حيوان صغير بسيط
    var ax=48*s, ay=h-55*s; g.fillStyle='#d9a7ff'; g.beginPath(); g.arc(ax,ay,14*s,0,Math.PI*2); g.fill();
    g.beginPath(); g.moveTo(ax-10*s,ay-10*s); g.lineTo(ax-15*s,ay-25*s); g.lineTo(ax-3*s,ay-15*s); g.fill();
    g.beginPath(); g.moveTo(ax+10*s,ay-10*s); g.lineTo(ax+15*s,ay-25*s); g.lineTo(ax+3*s,ay-15*s); g.fill();
    g.fillStyle='#071225'; g.beginPath(); g.arc(ax-5*s,ay-2*s,2*s,0,Math.PI*2); g.arc(ax+5*s,ay-2*s,2*s,0,Math.PI*2); g.fill();
    g.restore();
  }

  function draw(t) {
    requestAnimationFrame(draw);
    var w = canvas.width, h = canvas.height;
    g.setTransform(1, 0, 0, 1, 0, 0);
    scene(t,w,h,cx || w/2,cy || h/2,s || 1);

    mode = computeMode();
    var s = Math.min(w, h * 1.7) / 100;
    var cx = w / 2, cy = h / 2 - 3 * s;
    var accent = PALETTE[mode] || PALETTE.listening;

    // مستوى الصوت الخارج (لتحريك الفم)
    var target = 0;
    if (mode === 'speaking' && analyser) {
      analyser.getByteTimeDomainData(timeData);
      var sum = 0;
      for (var i = 0; i < timeData.length; i++) { var d = (timeData[i] - 128) / 128; sum += d * d; }
      target = Math.min(1, Math.sqrt(sum / timeData.length) * 5);
    }
    level += (target - level) * 0.35;

    // نظرات عشوائية بسيطة
    if (t > nextGaze) {
      gazeTX = (Math.random() - 0.5) * 5 * s;
      gazeTY = (Math.random() - 0.5) * 2.5 * s;
      nextGaze = t + 1400 + Math.random() * 2600;
    }
    var thinking = mode === 'thinking';
    var gx = thinking ? 4 * s : gazeTX;
    var gy = thinking ? -5 * s : gazeTY;
    gazeX += (gx - gazeX) * 0.12;
    gazeY += (gy - gazeY) * 0.12;

    // رمشة
    if (blinkStart < 0 && t > nextBlink) blinkStart = t;
    var blink = 1;
    if (blinkStart >= 0) {
      var ph = (t - blinkStart) / 170;
      if (ph >= 1) { blinkStart = -1; nextBlink = t + 2500 + Math.random() * 3500; }
      else blink = 1 - 0.93 * Math.sin(Math.PI * ph);
    }

    var ex = 22 * s, ey = cy - 4 * s, er = 9.5 * s;
    var scale = 1, smile = 12 * s, open = 0;

    // هالة ملونة حسب الحالة
    g.save(); g.globalAlpha=.22; g.fillStyle=accent; g.beginPath(); g.arc(cx,cy,38*s+level*8*s,0,Math.PI*2); g.fill(); g.restore();

    if (mode === 'sleep') {
      var br = 1 + 0.03 * Math.sin(t / 900);
      closedEye(cx - ex, ey, er * br, s);
      closedEye(cx + ex, ey, er * br, s);
      mouth(cx, cy + 20 * s, s, 0, 11 * s);
    } else {
      if (mode === 'hearing') scale = 1.12;
      else if (mode === 'thinking') scale = 0.95;
      else if (mode === 'connecting') scale = 0.92 + 0.08 * Math.sin(t / 250);
      else if (mode === 'speaking') scale = 1 + 0.04 * level;
      if (mode === 'hearing') smile = 14 * s;
      if (mode === 'speaking') { smile = 12 * s; open = level * 9 * s; }
      if (mode === 'thinking') smile = 8 * s;
      var r = er * scale;
      g.save(); EYE = accent;
      eye(cx - ex + gazeX, ey + gazeY, r, blink);
      eye(cx + ex + gazeX, ey + gazeY, r, blink);
      mouth(cx + gazeX * 0.3, cy + 20 * s, s, open, smile);
      g.restore();
    }

    hintEl.style.opacity = (mode === 'sleep' && !panelOpen) ? '1' : '0';

    // لا نوم تلقائي: يبقى الروبوت متاحًا حتى يلمسه المستخدم أو يغلق الصفحة.
  }

  resize();
  requestAnimationFrame(draw);
  setStatus('');
  if (!cfg.key) openPanel();
})();
</script>
</body>
</html>
